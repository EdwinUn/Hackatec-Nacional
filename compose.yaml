# Stack local: PostgreSQL + Redis + API.
#   docker compose up -d              # todo (la API migra sola al arrancar)
#   docker compose up -d db redis     # solo infraestructura (API con `make dev` en backend/)
#   docker compose up -d mqtt         # broker MQTT local (MQTT_URL=mqtt://localhost:1883)
services:
  db:
    image: docker.io/library/postgres:17
    container_name: hackatec-db
    environment:
      POSTGRES_USER: hackatec
      POSTGRES_PASSWORD: hackatec
      POSTGRES_DB: hackatec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackatec -d hackatec"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: hackatec-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    image: docker.io/library/eclipse-mosquitto:2
    container_name: hackatec-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./backend/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: ./backend
    container_name: hackatec-api
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://hackatec:hackatec@db:5432/hackatec
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media:
