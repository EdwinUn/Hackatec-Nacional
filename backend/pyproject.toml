[project]
name = "rio-monitor-backend"
version = "0.1.0"
description = "API de monitoreo y limpieza de agua de ríos (Hackatec Nacional 2026 · reto SECIHTI Puebla)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Visión artificial de los reportes ciudadanos (POST /api/v1/vision/analyze). Instalar con:
#   uv sync --extra vision
# Sin este extra la API arranca igual y el endpoint responde 503 `vision_unavailable`.
vision = [
    "ultralytics>=8.3,<9",
    "opencv-python-headless>=4.9,<5",
    "torch>=2.2",
    "torchvision>=0.17",
    # YOLO-World codifica los prompts de texto con CLIP (fork de Ultralytics).
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "ftfy",
    "regex",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false
# ultralytics exige `opencv-python` (con GUI); en un servidor usamos la variante headless.
# Ambas escriben el mismo módulo `cv2`, así que se excluye la primera.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

# PyTorch solo-CPU en Linux (la variante CUDA por defecto pesa varios GB).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: necesita PostgreSQL (ver README)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
